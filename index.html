<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Project: Rock Paper Scissors</title>

  <style>
    body {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      font-family: 'Poppins', sans-serif;
      text-align: center;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 0;
    }

    h1 {
      color: gold;
      margin-bottom: 10px;
    }

    #welcome {
      margin-bottom: 20px;
      opacity: 0;
      animation: fadeIn 2s ease forwards;
      animation-delay: 0.8s;
    }

    .button-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 15px;
    }

    button {
      background-color: #ff9800;
      color: white;
      border: none;
      padding: 15px 25px;
      margin: 10px;
      border-radius: 10px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.3s;
    }

    button:hover {
      transform: scale(1.1);
      background-color: #ffc107;
    }

    #results, #score {
      margin-top: 15px;
    }

    #rock {
      background-color: #f44336; /* red */
    }

    #paper {
      background-color: #2196f3; /* blue */
    }

    #scissors {
      background-color: #4caf50; /* green */
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <h1> Rock, Paper, Scissors — The Ultimate Showdown!</h1>
  <div id="welcome"></div>

  <div class="button-container">
    <button id="rock">rock</button>
    <button id="paper">paper</button>
    <button id="scissors">scissors</button>
  </div>

  <div id="results"></div>
  <div id="score"></div>

  <script src="script.js"></script>
</body>
</html>
